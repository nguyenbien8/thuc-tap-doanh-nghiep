# Experiment 1 – synthetic smart-home event log with known ground truth.
# Run:  smart-home generate-demo  &&  smart-home run
name: demo
title: dữ liệu mô phỏng (2 cư dân, 28 ngày)

data:
  source: csv                              # csv | strands
  raw_path: data/raw/smart_home_events.csv
  random_seed: 42
  demo_days: 28

preprocessing:
  required_columns: [timestamp, resident_id, room, sensor_type, sensor_id, value, event_type]
  max_missing_fraction: 0.40               # drop a row if > 40 % of its schema cells are empty
  inactivity_gap_minutes: 30               # silence longer than this ends a session
  split_on_room_change: true               # moving to another room also ends a session
  min_session_minutes: 0                   # keep single-event sessions (they become noise)

discovery:
  eps_hours: 0.5                           # DBSCAN radius: start times within ~30 minutes
  min_samples: 5                           # lower bound of DBSCAN min_samples
  min_samples_day_ratio: 0.2               # min_samples = max(5, ceil(0.2 x observed days))
  duration_weight: 0.5                     # doubling the duration = 0.5 h of distance
  min_support: 0.5                         # a pattern is a habit if it occurs on >= 50 % of days

output:
  processed_dir: data/processed/demo
  results_dir: reports/results/demo
