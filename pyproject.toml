[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-home-patterns"
version = "0.1.0"
description = "Unsupervised discovery of recurring human activities from smart-home sensor events"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "seaborn>=0.12",
  "PyYAML>=6.0"
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
smart-home = "smart_home_patterns.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
